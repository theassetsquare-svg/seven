<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="seven" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff3d6e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3d6e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- Big stylized "7" -->
  <g transform="translate(32 33)">
    <text x="0" y="0"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="Arial Black, sans-serif"
          font-weight="900"
          font-size="46"
          fill="url(#seven)"
          letter-spacing="-2">7</text>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="58" width="64" height="6" fill="#ff3d6e"/>
  <rect x="0" y="58" width="32" height="6" fill="#ffd84d"/>
</svg>
