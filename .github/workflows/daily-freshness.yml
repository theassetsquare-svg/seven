name: 매일 신선도 자동화 (sitemap lastmod + IndexNow 핑 + 헬스체크)

# 매일 KST 09시 (UTC 00시)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write   # sitemap.xml 자동 커밋

env:
  SITE: https://seven-97b.pages.dev
  INDEXNOW_KEY: 63ddda7bd582472cbcdcd585babf59de

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: sitemap.xml lastmod 오늘 날짜로 갱신
        id: bump
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "오늘: $TODAY"
          if [ -f sitemap.xml ]; then
            sed -i -E "s|<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>|<lastmod>${TODAY}</lastmod>|g" sitemap.xml
            echo "today=$TODAY" >> $GITHUB_OUTPUT
          fi

      - name: 변경 확인 + 커밋
        id: commit
        run: |
          if git diff --quiet sitemap.xml; then
            echo "변경 없음"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "🤖 sitemap lastmod 자동 갱신 (${{ steps.bump.outputs.today }})"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 1분 대기 (배포 반영)
        if: steps.commit.outputs.changed == 'true'
        run: sleep 60

      - name: IndexNow 핑 — Bing
        run: |
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"seven-97b.pages.dev\",
              \"key\": \"${INDEXNOW_KEY}\",
              \"keyLocation\": \"${SITE}/${INDEXNOW_KEY}.txt\",
              \"urlList\": [
                \"${SITE}/\",
                \"${SITE}/booking/\",
                \"${SITE}/price/\",
                \"${SITE}/location/\",
                \"${SITE}/vip/\",
                \"${SITE}/reviews/\",
                \"${SITE}/guide/\",
                \"${SITE}/faq/\"
              ]
            }" -w "\nHTTP %{http_code}\n" || true

      - name: IndexNow 핑 — Yandex
        run: |
          curl -sS -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"seven-97b.pages.dev\",
              \"key\": \"${INDEXNOW_KEY}\",
              \"keyLocation\": \"${SITE}/${INDEXNOW_KEY}.txt\",
              \"urlList\": [
                \"${SITE}/\",
                \"${SITE}/booking/\",
                \"${SITE}/price/\",
                \"${SITE}/location/\",
                \"${SITE}/vip/\",
                \"${SITE}/reviews/\",
                \"${SITE}/guide/\",
                \"${SITE}/faq/\"
              ]
            }" -w "\nHTTP %{http_code}\n" || true

      - name: 8개 페이지 헬스체크
        id: health
        run: |
          set +e
          FAIL=0
          REPORT=""
          for p in / /booking/ /price/ /location/ /vip/ /reviews/ /guide/ /faq/; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SITE}${p}")
            SIZE=$(curl -s -o /dev/null -w "%{size_download}" "${SITE}${p}")
            if [ "$CODE" != "200" ]; then
              echo "❌ $p → $CODE"
              FAIL=$((FAIL+1))
              REPORT="$REPORT\n- ❌ $p → HTTP $CODE"
            else
              echo "✅ $p → $CODE ($SIZE bytes)"
              REPORT="$REPORT\n- ✅ $p → 200 ($SIZE B)"
            fi
          done
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ "$FAIL" -gt 0 ]; then
            echo "fail=$FAIL" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 헬스 실패 시 이슈 생성
        if: failure() && steps.health.outputs.fail
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            const report = `${{ steps.health.outputs.report }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 사이트 헬스체크 실패 (${today})`,
              body: `자동 헬스체크에서 ${{ steps.health.outputs.fail }}개 페이지가 200을 반환하지 않았습니다.\n\n${report}\n\n워크플로 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation', 'health-check']
            });

      - name: 결과 요약
        if: always()
        run: |
          echo "## 매일 신선도 자동화 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 날짜: ${{ steps.bump.outputs.today }}" >> $GITHUB_STEP_SUMMARY
          echo "- sitemap 변경: ${{ steps.commit.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- 헬스체크: ${{ steps.health.outputs.fail || '전체 정상' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.health.outputs.report }}" >> $GITHUB_STEP_SUMMARY
